<div style="min-height: 100vh; background: linear-gradient(135deg, #ecf5f0 0%, #f3f4f6 100%); display: flex; align-items: center; justify-content: center; padding: 1rem;">
  <div style="width: 100%; max-width: 448px;">
    <!-- Logo/Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background-color: #22c55e; border-radius: 1rem; margin-bottom: 1rem;">
        <div style="width: 32px; height: 32px; border: 4px solid white; border-radius: 0.5rem;"></div>
      </div>
      <h1 style="font-size: 1.875rem; font-weight: 600; color: #111827; margin-bottom: 0.5rem;">Library App</h1>
      <p style="color: #6b7280;">Staff Login Portal</p>
    </div>

    <!-- Login Card -->
    <div style="background-color: white; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); padding: 2rem;">
      <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>
      
      <form (ngSubmit)="handleLogin($event)" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
            Username
          </label>
          <div style="position: relative;">
            <span style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); font-size: 1.25rem;">👤</span>
            <input
              pInputText
              type="text"
              [(ngModel)]="username"
              name="username"
              placeholder="Enter your username"
              class="login-input"
              style="width: 100%; padding-left: 2.5rem; padding-right: 1rem; padding-top: 0.75rem; padding-bottom: 0.75rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem;"
              required
            />
          </div>
        </div>

        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
            Password
          </label>
          <div style="position: relative;">
            <span style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); font-size: 1.25rem;">🔒</span>
            <input
              pInputText
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Enter your password"
              class="login-input"
              style="width: 100%; padding-left: 2.5rem; padding-right: 1rem; padding-top: 0.75rem; padding-bottom: 0.75rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem;"
              required
            />
          </div>
        </div>

        <button pButton type="submit" class="btn-signin" style="width: 100%; background-color: #22c55e; color: white; padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: 500; border: none; cursor: pointer; transition: all 0.2s ease; font-size: 1rem;">Sign In</button>

        @if (error()) {
          <div style="color: #dc2626; font-size: 0.875rem; text-align: center;">
            {{ error() }}
          </div>
        }
      </form>

      <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb;">
        <p style="font-size: 0.75rem; color: #6b7280; text-align: center;">
          Demo credentials:<br>
          Librarian: <span style="font-weight: 500;">librarian / librarian123</span><br>
          Assistant: <span style="font-weight: 500;">assistant / assistant123</span>
        </p>
      </div>
    </div>
  </div>
</div>
