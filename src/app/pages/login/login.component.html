<div class="login-wrapper min-vh-100 d-flex">
    <!-- Left Half - Logo Display -->
    <div class="logo-section d-flex align-items-center justify-content-center">
        <div class="logo-display text-center">
            <img src="assets/images/logo.png" alt="School Logo" class="school-logo mb-5">
            <h1 class="fs-1 fw-bold text-white mb-3">Library</h1>
            <p class="text-white-50 fs-5">Mystic Falls High School</p>
        </div>
    </div>

    <!-- Right Half - Login Form -->
    <div class="form-section d-flex align-items-center justify-content-center p-4">
        <div class="login-form-container">
            <h2 class="fs-4 fw-semibold mb-4 text-center text-dark">Welcome</h2>

            <form (ngSubmit)="handleLogin($event)" class="d-flex flex-column gap-3">
                <div class="mb-3">
                    <label class="d-block small fw-medium text-secondary mb-2">
                        Username
                    </label>
                    <div class="position-relative">
                        <span class="input-icon">👤</span>
                        <input pInputText type="text" [(ngModel)]="username" name="username" autocomplete="off"
                            placeholder="Enter your username" class="form-control login-input ps-5" required />
                    </div>
                </div>

                <div class="mb-3">
                    <label class="d-block small fw-medium text-secondary mb-2">
                        Password
                    </label>
                    <div class="position-relative">
                        <span class="input-icon">🔒</span>
                        <input pInputText type="password" [(ngModel)]="password" name="password"
                            placeholder="Enter your password" class="form-control login-input ps-5" required />
                    </div>
                </div>

                <button pButton type="submit" class="btn btn-primary btn-signin w-100 py-2 fw-medium">Sign
                    In</button>

                @if (error()) {
                <div class="text-danger small text-center mt-2">
                    {{ error() }}
                </div>
                }
            </form>

            <div class="mt-4 pt-4 border-top">
                <p class="small text-muted text-center mb-0">
                    Demo credentials:<br>
                    Librarian: <span class="fw-medium">librarian / librarian123</span><br>
                    Assistant: <span class="fw-medium">assistant / assistant123</span>
                </p>
            </div>
        </div>
    </div>
</div>
