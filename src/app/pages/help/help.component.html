<div class="d-flex flex-column gap-4">
  <div class="card border-0 shadow-sm rounded p-4">
    <h2 class="fs-4 fw-semibold mb-2">Help & Support</h2>
    <p class="small text-muted mb-4">Find answers to frequently asked questions</p>

    <div class="d-flex flex-column gap-3">
      @for (faq of faqs(); track faq.id) {
        <div class="border rounded p-3">
          <button class="btn btn-link w-100 text-start text-decoration-none d-flex justify-content-between align-items-center p-0 fw-semibold text-dark"
                  (click)="toggleFAQ(faq)">
            <span>{{ faq.question }}</span>
            <span class="faq-arrow" [class.expanded]="faq.expanded">▼</span>
          </button>
          @if (faq.expanded) {
            <div class="mt-3 pt-3 border-top text-muted small">
              {{ faq.answer }}
            </div>
          }
        </div>
      }
    </div>

    <div class="mt-5 pt-5 border-top">
      <h3 class="fw-semibold mb-3">Contact Support</h3>
      <div class="row g-4">
        <div class="col-md-6">
          <p class="fw-semibold text-dark mb-1">Email Support</p>
          <p class="text-muted small">support&#64;library.com</p>
        </div>
        <div class="col-md-6">
          <p class="fw-semibold text-dark mb-1">Phone Support</p>
          <p class="text-muted small">+1 (555) 123-4567</p>
        </div>
      </div>
    </div>
  </div>
</div>
