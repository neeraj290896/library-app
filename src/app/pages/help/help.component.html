<div style="display: flex; flex-direction: column; gap: 1.5rem;">
  <div style="background-color: white; border-radius: 0.5rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
    <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem;">Help & Support</h2>
    <p style="font-size: 0.875rem; color: #6b7280; margin-bottom: 1.5rem;">Find answers to frequently asked questions</p>

    <div style="display: flex; flex-direction: column; gap: 1rem;">
      @for (faq of faqs(); track faq.id) {
        <div style="border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem;">
          <button style="width: 100%; text-align: left; background: none; border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 0; font-weight: 600; color: #111827;"
                  (click)="toggleFAQ(faq)">
            <span>{{ faq.question }}</span>
            <span style="transform: {{faq.expanded ? 'rotate(180deg)' : 'rotate(0deg)'}}; transition: transform 0.2s;">▼</span>
          </button>
          @if (faq.expanded) {
            <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 0.875rem;">
              {{ faq.answer }}
            </div>
          }
        </div>
      }
    </div>

    <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e5e7eb;">
      <h3 style="font-weight: 600; margin-bottom: 1rem;">Contact Support</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div>
          <p style="font-weight: 600; color: #111827; margin-bottom: 0.25rem;">Email Support</p>
          <p style="color: #6b7280; font-size: 0.875rem;">support&#64;library.com</p>
        </div>
        <div>
          <p style="font-weight: 600; color: #111827; margin-bottom: 0.25rem;">Phone Support</p>
          <p style="color: #6b7280; font-size: 0.875rem;">+1 (555) 123-4567</p>
        </div>
      </div>
    </div>
  </div>
</div>
