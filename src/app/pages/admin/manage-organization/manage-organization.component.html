<div class="manage-organization-container">
    <div class="table-clear-filter">
        <p-button class="p-button-outlined" styleClass="btn-main-outlined" label="Clear" icon="pi pi-filter-slash"
            (onClick)="clear()"></p-button>
    </div>
    <p-table #dt [value]="organizations" [autoLayout]="false" [paginator]="true" [rows]="10"
        [rowsPerPageOptions]="[10, 20, 50, 100]" paginatorPosition="top" [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries">

        <ng-template pTemplate="header">
            <tr class="border-bottom">
                <th class="text-start text-muted fw-medium" style="width: 10%;">
                    <div class="d-flex align-items-center gap-2">
                        <div class="d-flex align-items-center gap-2">
                            S.No
                        </div>
                    </div>
                </th>
                <th class="text-start text-muted fw-medium">
                    <div class="d-flex align-items-center gap-2">
                        <div class="d-flex align-items-center gap-2" pSortableColumn="OrganizationName">
                            Organization
                            <p-sortIcon field="OrganizationName"></p-sortIcon>
                        </div>
                        <span class="pi" [ngClass]="selectedOrganizationNameList.length > 0 ? 'pi-filter-fill' : 'pi-filter'"
                            (click)="showFilter()"></span>
                    </div>
                </th>
                <th class="text-start text-muted fw-medium" style="width: 15%;">Logo</th>
                <th class="text-start text-muted fw-medium" style="width: 15%;">Image</th>
                <th class="text-start text-muted fw-medium" style="width: 10%;">
                    <div class="d-flex align-items-center gap-2">
                        <div class="d-flex align-items-center gap-2" pSortableColumn="IsActive">
                            Status
                            <p-sortIcon field="IsActive"></p-sortIcon>
                        </div>
                        <span class="pi" [ngClass]="selectedStatusList.length > 0 ? 'pi-filter-fill' : 'pi-filter'"
                            (click)="showFilter()"></span>
                    </div>
                </th>
                <th class="text-start text-muted fw-medium" style="width: 10%;">Valid Upto</th>
                <th class="text-start text-muted fw-medium" style="width: 10%;">
                    <div class="d-flex align-items-center justify-content-center">
                        <span class="pi pi-plus-circle" (click)="editOrganization()" pTooltip="Add Organization"></span>
                    </div>
                </th>
            </tr>
            @if (showFt) {
            <tr>
                <th></th>
                <th>
                    <p-columnFilter field="Organization" matchMode="in" [showMenu]="false" [showClearButton]="false">
                        <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                            <p-multiSelect [options]="organizationNameList" [(ngModel)]="selectedOrganizationNameList"
                                (onChange)="filter($event.value)" selectedItemsLabel="{0} items selected"
                                [resetFilterOnHide]="true" optionLabel="label" optionValue="value" appendTo="body"
                                placeholder="All">
                            </p-multiSelect>
                        </ng-template>
                    </p-columnFilter>
                </th>
                <th></th>
                <th></th>
                <th></th>
                <th>
                    <p-columnFilter field="IsActive" matchMode="in" [showMenu]="false" [showClearButton]="false">
                        <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                            <p-multiSelect [options]="statusList" [(ngModel)]="selectedStatusList"
                                (onChange)="filter($event.value)" selectedItemsLabel="{0} items selected"
                                [resetFilterOnHide]="true" optionLabel="label" optionValue="value" appendTo="body"
                                placeholder="All">
                            </p-multiSelect>
                        </ng-template>
                    </p-columnFilter>
                </th>
                <th></th>
            </tr>
            }
        </ng-template>

        <ng-template pTemplate="body" let-organization let-index="rowIndex">
            <tr class="border-bottom">
                <td>{{ index + 1 }}</td>
                <td>{{ organization.OrganizationName }}</td>
                <td><img [src]="(imagePrefixPath + organization.LogoPath)" [alt]="organization.LogoPath" width="100" class="shadow-4" /></td>
                <td><img [src]="(imagePrefixPath + organization.ImagePath)" [alt]="organization.ImagePath" width="100" class="shadow-4" /></td>
                <td>
                    <p-tag [value]="organization.IsActive ? 'Active' : 'In-Active'"
                        [severity]="getStatusSeverity(organization.IsActive)"></p-tag>
                </td>
                <td>{{ organization.ValidUpto | date:'dd-MMM-yyyy' }}</td>
                <td>
                    <div class="d-flex align-items-center gap-2">
                        <button pButton icon="pi pi-pencil" (click)="editOrganization(organization)"
                            class="p-button-rounded p-button-text p-button-sm" pTooltip="Edit Organization"></button>
                        <button pButton icon="pi pi-trash" (click)="deleteOrganization(organization)"
                            class="p-button-rounded p-button-text p-button-danger p-button-sm" pTooltip="Delete Organization"></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="7" class="text-center">
                    No organizations found.
                </td>
            </tr>
        </ng-template>
    </p-table>
    <p-dialog [header]="header" [(visible)]="organizationDialogVisible" [modal]="true" [style]="{ width: '60vw' }" appendTo="body">
        <div class="row">
            <div class="col-6 mb-3" >
                <label class="d-block small fw-medium text-secondary mb-1" for="organizationName">
                    Organization Name<sup>*</sup>
                </label>
                <input id="organizationName" type="text" class="form-control" pInputText
                    [(ngModel)]="currentOrganization.OrganizationName" [ngModelOptions]="{standalone: true}"
                    placeholder="Enter organization" (ngModelChange)="validateInput('OrganizationName')" />
                <div *ngIf="errors.OrganizationName" class="text-danger mt-1 small">{{ errors.OrganizationName }}</div>
            </div>
            <div class="col-6 mb-3">
                <label class="d-block small fw-medium text-secondary mb-1" for="isActive">
                    Status<sup>*</sup>
                </label>
                <p-select id="isActive" [(ngModel)]="currentOrganization.IsActive" [ngModelOptions]="{standalone: true}"
                    [options]="options" optionLabel="label" optionValue="value" placeholder="Select Status" [disabled] = "currentOrganization.OrganizationId == 0"
                    styleClass="w-100" appendTo="body" (ngModelChange)="validateInput('IsActive')" />
                <div *ngIf="errors.IsActive" class="text-danger mt-1 small">{{ errors.IsActive }}</div>
            </div>  
            <div class="col-6 mb-3">
                <label class="d-block small fw-medium text-secondary mb-1" for="organizationImage">
                    Organization Image<sup>*</sup>
                </label>

                <div class="d-flex align-items-center gap-2 mb-2">
                    <button pButton type="button" label="Change Image" icon="pi pi-upload"
                        class="p-button-sm p-button-outlined"
                        (click)="imageInput.click()"></button>
                    <input #imageInput type="file" accept="image/*" class="d-none"
                        (change)="onFileSelected($event, 'image')" />
                </div>

                <img [src]="getImageSrc(currentOrganization?.ImagePath)" [alt]="currentOrganization?.ImagePath" width="100" class="shadow-4" />
                <div *ngIf="errors.ImagePath" class="text-danger mt-1 small">{{ errors.ImagePath }}</div>
            </div>

            <div class="col-6 mb-3">
                <label class="d-block small fw-medium text-secondary mb-1" for="organizationLogo">
                    Organization Logo<sup>*</sup>
                </label>

                <div class="d-flex align-items-center gap-2 mb-2">
                    <button pButton type="button" label="Change Logo" icon="pi pi-upload"
                        class="p-button-sm p-button-outlined"
                        (click)="logoInput.click()"></button>
                    <input #logoInput type="file" accept="image/*" class="d-none"
                        (change)="onFileSelected($event, 'logo')" />
                </div>

                <img [src]="getImageSrc(currentOrganization?.LogoPath)" [alt]="currentOrganization?.LogoPath" width="100" class="shadow-4" />
                <div *ngIf="errors.LogoPath" class="text-danger mt-1 small">{{ errors.LogoPath }}</div>
            </div>
         </div>
        <ng-template pTemplate="footer">
            <div class="d-flex justify-content-end align-items-center gap-3">
                <p-button type="button" label="Cancel" [style]="{ width: '6rem' }" class="p-button-outlined"
                    styleClass="btn-main-outlined" (click)="organizationDialogVisible = false"></p-button>
                <p-button type="button" label="Save" [style]="{ width: '6rem' }" styleClass="btn-main"
                    (click)="saveOrganization()"></p-button>
            </div>
        </ng-template>
    </p-dialog>
</div>
