<div class="d-flex flex-column gap-4">
    <div class="card border-0 shadow-sm rounded p-4">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h2 class="fs-4 fw-semibold mb-1">Admin</h2>
                <p class="small text-muted mb-0">Manage access for users</p>
            </div>
            <button pButton icon="pi pi-plus" label="Add User" class="p-button-outlined btn-sm active-filter"></button>
        </div>

        <!-- Filter Tabs -->
        <p-tabView [(activeIndex)]="activeTab" class="admin-tabs">            
            <p-tabPanel header="Manage Users"></p-tabPanel>
            <p-tabPanel header="Manage Role"></p-tabPanel>
            <p-tabPanel header="Manage Organization"></p-tabPanel>
            <p-tabPanel header="Manage Department"></p-tabPanel>
            <p-tabPanel header="Manage TransactionType"></p-tabPanel>            
        </p-tabView>

          <!-- Users Table -->
        <div class="table-responsive">
            <p-table [value]="staffMembers()" styleClass="compact-table"
                [tableStyle]="{'width':'100%','font-size':'0.875rem'}">
                <ng-template pTemplate="header">
                    <tr class="border-bottom">
                        <th class="text-start text-muted fw-medium">Staff ID</th>
                        <th class="text-start text-muted fw-medium">Name</th>
                        <th class="text-start text-muted fw-medium">Role</th>
                        <th class="text-start text-muted fw-medium">Email</th>
                        <th class="text-start text-muted fw-medium">Status</th>
                        <th class="text-start text-muted fw-medium">Action</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-staff>
                    <tr class="border-bottom table-row">
                        <td>{{ staff.id }}</td>
                        <td>{{ staff.name }}</td>
                        <td>{{ staff.role }}</td>
                        <td>{{ staff.email }}</td>
                        <td>
                            <span class="badge rounded-pill px-3 py-1"
                                [class.bg-success-subtle]="staff.status === 'Active'"
                                [class.text-success]="staff.status === 'Active'"
                                [class.bg-danger-subtle]="staff.status !== 'Active'"
                                [class.text-danger]="staff.status !== 'Active'">
                                {{ staff.status }}
                            </span>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <button pButton icon="pi pi-pencil"
                                    class="p-button-rounded p-button-text p-button-sm btn-icon"></button>
                                <button pButton icon="pi pi-trash"
                                    class="p-button-rounded p-button-text p-button-danger p-button-sm btn-icon"></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>

        <!-- Pagination -->
        <div class="d-flex align-items-center justify-content-center mt-4 gap-3">
            <button pButton label="< PREVIOUS" class="p-button-outlined btn-sm"></button>
            <button pButton label="NEXT >>" class="p-button-outlined btn-sm"></button>
        </div>
    </div>
</div>
