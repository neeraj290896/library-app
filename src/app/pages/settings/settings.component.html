<div class="settings-container d-flex flex-column gap-4">
    <p-accordion value="">
        <p-accordion-panel value="0">
            <p-accordion-header>
                <div class="d-flex align-items-center justify-content-between w-100">
                    <div>
                        <h2 class="fs-4 fw-semibold mb-1">Application Settings</h2>
                        <p class="small text-muted mb-0">Manage Application Settings</p>
                    </div>
                </div>
            </p-accordion-header>
            <p-accordion-content>
                <div class="row g-3 mt-0 mb-4">
                    <div class="col-md-6">
                        <label class="d-block small fw-medium text-secondary mb-1">Cut-Off Days</label>
                        <input id="cutOffDays" type="cuttOffDays" placeholder="Enter Cut-Off-Days" pInputText
                            class="form-control" [ngModelOptions]="{standalone: true}"
                            (ngModelChange)="validateInput('CutOffDays', $event)"
                            [(ngModel)]="settingDetails.CutOffDays" />
                        <div *ngIf="errors.CutOffDays" class="text-danger mt-1 small">{{ errors.CutOffDays }}</div>
                    </div>
                    <div class="col-md-6">
                        <label class="d-block small fw-medium text-secondary mb-1">
                            Fine Percentage ({{settingDetails.FinePercentage}})
                        </label>
                        <p-inputgroup>
                            <input id="finePercentage" type="finePercentage" placeholder="Enter fine percentage"
                                pInputText class="form-control" [ngModelOptions]="{standalone: true}"
                                [(ngModel)]="finePercentage"
                                (ngModelChange)="validateInput('FinePercentage', $event)" />
                            <p-inputgroup-addon>%</p-inputgroup-addon>
                        </p-inputgroup>
                        <div *ngIf="errors.FinePercentage" class="text-danger mt-1 small">{{ errors.FinePercentage }}
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3 justify-content-end border-top pt-4">
                    <p-button type="button" label="Save" [style]="{ width: '6rem' }" styleClass="btn-main"
                        (click)="saveAplnSettings()"></p-button>
                </div>
            </p-accordion-content>
        </p-accordion-panel>
    </p-accordion>

    <p-accordion value="">
        <p-accordion-panel value="0">
            <p-accordion-header>
                <div class="d-flex align-items-center justify-content-between w-100">
                    <div>
                        <h2 class="fs-4 fw-semibold mb-1">Notification Settings</h2>
                        <p class="small text-muted mb-0">Manage Notification Settings</p>
                    </div>
                </div>
            </p-accordion-header>
            <p-accordion-content>
                <div class="row g-3 mt-0 mb-4">
                    <div class="d-flex gap-2 align-items-center col-md-6">
                        <p-checkbox inputId="email-notif" [binary]="true"
                            [(ngModel)]="settingDetails.EnableEmailNotification"
                            [ngModelOptions]="{standalone: true}"></p-checkbox>
                        <label for="email-notif" class="form-check-label small text-secondary">Enable email
                            notifications</label>
                    </div>
                    <div class="d-flex gap-2 align-items-center col-md-6">
                        <p-checkbox inputId="enable-fineRule" [binary]="true"
                            [(ngModel)]="settingDetails.EnableFineRule"
                            [ngModelOptions]="{standalone: true}"></p-checkbox>
                        <label for="enable-fineRule" class="form-check-label small text-secondary">Enable Fine
                            Rule</label>
                    </div>
                    <div class="d-flex gap-2 align-items-center col-md-6">
                        <p-checkbox inputId="wishlis-notif" [binary]="true"
                            [(ngModel)]="settingDetails.EnableWishlistNotification"
                            [ngModelOptions]="{standalone: true}"></p-checkbox>
                        <label for="wishlis-notif" class="form-check-label small text-secondary">Enable Wishlist
                            notifications</label>
                    </div>
                    <div class="d-flex gap-2 align-items-center col-md-6"
                        *ngIf="(loggedInUserDetails.RoleId ?? 0) == 1">
                        <p-checkbox inputId="mobile-notif" [binary]="true"
                            [(ngModel)]="settingDetails.EnableMobileNotification"
                            [ngModelOptions]="{standalone: true}"></p-checkbox>
                        <label for="mobile-notif" class="form-check-label small text-secondary">Enable SMS
                            notifications</label>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3 justify-content-end border-top pt-4">
                    <p-button type="button" label="Save" [style]="{ width: '6rem' }" styleClass="btn-main"
                        (click)="saveAplnSettings()"></p-button>
                </div>
            </p-accordion-content>
        </p-accordion-panel>
    </p-accordion>

    <p-accordion value="">
        <p-accordion-panel value="0">
            <p-accordion-header>
                <div class="d-flex align-items-center justify-content-between w-100">
                    <div>
                        <h2 class="fs-4 fw-semibold mb-1">Danger Zone</h2>
                        <p class="small text-muted mb-0">Manage Password Settings</p>
                    </div>
                </div>
            </p-accordion-header>
            <p-accordion-content>
                <div class="row g-3 mt-0">
                    <div class="d-flex gap-2 align-items-center col-md-12">
                        <p-button type="button" label="Reset Password" [style]="{ width: '10rem' }"
                            styleClass="btn-main-danger"></p-button>
                    </div>
                </div>
            </p-accordion-content>
        </p-accordion-panel>
    </p-accordion>
</div>
