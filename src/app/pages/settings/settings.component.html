<div class="d-flex flex-column gap-4">
    <div class="card border-0 shadow-sm rounded p-4">
        <h2 class="fs-4 fw-semibold mb-2">Settings</h2>
        <p class="small text-muted mb-4">Manage your application settings</p>

        <div class="d-flex flex-column gap-5">
            <div class="border-bottom pb-4">
                <h3 class="fw-semibold mb-3">Account Settings</h3>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="d-block small fw-medium text-secondary mb-1">Email</label>
                        <input type="email" placeholder="your@email.com" class="form-control" />
                    </div>
                    <div class="col-md-6">
                        <label class="d-block small fw-medium text-secondary mb-1">Phone</label>
                        <input type="tel" placeholder="+1 (555) 000-0000" class="form-control" />
                    </div>
                </div>
            </div>

            <div class="border-bottom pb-4">
                <h3 class="fw-semibold mb-3">Notification Settings</h3>
                <div class="d-flex flex-column gap-3">
                    <div class="form-check d-flex gap-2 align-items-center">
                        <input type="checkbox" id="email-notif" checked class="form-check-input" />
                        <label for="email-notif" class="form-check-label small text-secondary">Enable email
                            notifications</label>
                    </div>
                    <div class="form-check d-flex gap-2 align-items-center">
                        <input type="checkbox" checked class="form-check-input" />
                        <label class="form-check-label small text-secondary">Enable overdue book alerts</label>
                    </div>
                    <div class="form-check d-flex gap-2 align-items-center">
                        <input type="checkbox" checked class="form-check-input" />
                        <label class="form-check-label small text-secondary">Weekly summary report</label>
                    </div>
                </div>
            </div>

            <div class="pb-4">
                <h3 class="fw-semibold mb-3">Danger Zone</h3>
                <button class="btn btn-danger px-4 py-2 fw-medium btn-danger">
                    Reset Password
                </button>
            </div>

            <div class="d-flex align-items-center gap-3 justify-content-end border-top pt-4">
                <button class="btn btn-outline-secondary px-4 py-2 fw-medium btn-cancel">
                    Cancel
                </button>
                <button class="btn btn-primary px-4 py-2 fw-medium btn-save">
                    Save Changes
                </button>
            </div>
        </div>
    </div>
</div>
