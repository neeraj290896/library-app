<div class="d-flex flex-column gap-4">
    <div class="card border-0 shadow-sm rounded p-4">
        <!-- <h2 class="fs-4 fw-semibold mb-2">Settings</h2> -->        

        <div class="d-flex flex-column gap-4">
            <div class="border-bottom pb-3" *ngIf="(loggedInUserDetails.RoleId ?? 0) <= 2">
                <h3 class="fw-semibold">Settings</h3>
                <p class="small text-muted">Manage application settings</p>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="d-block small fw-medium text-secondary mb-1">Cut Off Dayst</label>
                        <input type="cuttOffDays" placeholder="xx" class="form-control" [ngModel]="settingDetails.CutOffDays" />
                    </div>
                    <div class="col-md-6">
                        <label class="d-block small fw-medium text-secondary mb-1">Fine Percentage</label>
                        <input type="finePercentage" placeholder="+1 (555) 000-0000" class="form-control" [ngModel]="settingDetails.FinePercentage"/>
                    </div>
                </div>
            </div>

            <div class="border-bottom pb-4" *ngIf="(loggedInUserDetails.RoleId ?? 0) <=2">
                <h3 class="fw-semibold mb-3">Notification Settings</h3>
                <div class="d-flex flex-column gap-3 border-bottom pb-3">
                    <div class="row g-3">
                        <div class="form-check d-flex gap-2 align-items-center col-md-6">
                            <input type="checkbox" id="email-notif" checked class="form-check-input" [ngModel]="settingDetails.EnableEmailNotification"/>
                            <label for="email-notif" class="form-check-label small text-secondary">Enable email
                                notifications</label>
                        </div>
                        <div class="form-check d-flex gap-2 align-items-center col-md-6">
                            <input type="checkbox" id="enable-fineRule" checked class="form-check-input" [ngModel]="settingDetails.EnableFineRule"/>
                            <label for="enable-fineRule" class="form-check-label small text-secondary">Enable Fine Rule</label>
                        </div>
                        <div class="form-check d-flex gap-2 align-items-center col-md-6">
                            <input type="checkbox" id="wishlis-notif" checked class="form-check-input" [ngModel]="settingDetails.EnableWishlistNotification"/>
                            <label for="wishlis-notif" class="form-check-label small text-secondary">Enable Wishlist notifications</label>
                        </div>
                        <div class="form-check d-flex gap-2 align-items-center col-md-6" *ngIf="(loggedInUserDetails.RoleId ?? 0) == 1">
                            <input type="checkbox" id="mobile-notif" checked class="form-check-input" [ngModel]="settingDetails.EnableMobileNotification"/>
                            <label for="mobile-notif" class="form-check-label small text-secondary">Enable Mobile notifications</label>
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3 justify-content-end border-top pt-4">
                    <button class="btn btn-outline-secondary px-4 py-2 fw-medium btn-cancel">
                        Cancel
                    </button>
                    <button class="btn btn-primary px-4 py-2 fw-medium btn-save">
                        Save Changes
                    </button>
                </div>
            </div>

            <div class="pb-4">
                <h3 class="fw-semibold mb-3">Danger Zone</h3>
                <button class="btn btn-danger px-4 py-2 fw-medium btn-danger">
                    Reset Password
                </button>
            </div>

            
        </div>
    </div>
</div>
