<div class="d-flex flex-column gap-3">
    <div class="card border-0 shadow-sm rounded p-3">
        <!-- Header -->
        <div class="d-flex align-items-center justify-content-between">
            <div>
                <h2 class="fs-4 fw-semibold mb-1">Welcome!</h2>
                <p class="small text-muted mb-0">{{ currentDate | date:'fullDate' }}</p>
            </div>
            <div class="position-relative">
                <span class="pi pi-search search-icon position-absolute text-muted"></span>
                <input pInputText type="text" placeholder="Search book" [(ngModel)]="searchTerm"
                    (input)="onSearch(searchTerm)" class="form-control ps-5" />
            </div>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="row g-3">
        @for (stat of dashboardSummary; track stat.label) {
        <div class="col-md-6 col-lg-3">
            <p-card>
                <div class="small text-muted mb-2">{{ stat.label }}</div>
                <div class="d-flex align-items-start gap-2">
                    <div class="fs-4 fw-semibold">{{ stat.total }}</div>
                    <span class="badge stat-badge stat-badge-up">
                        {{ stat.active }}
                    </span>
                </div>
            </p-card>
        </div>
        }
    </div>

    <!-- Quick Actions -->
    <div class="card border-0 shadow-sm rounded p-3">
        <h3 class="fs-5 fw-semibold mb-3">Quick Actions</h3>
        <div class="d-flex gap-2 flex-wrap">
            <p-button type="button" label="Overdue Books" styleClass="btn-main" (click)="setFilter('overdue')"></p-button>
            <p-button type="button" label="Add New Book"
                [ngClass]="{'p-button-outlined': activeFilter !== 'addNewBook'}"
                [styleClass]="activeFilter !== 'addNewBook' ? 'btn-main-outlined' : ''"
                (click)="setFilter('addNewBook')"></p-button>
            <p-button type="button" label="Register User"
                [ngClass]="{'p-button-outlined': activeFilter !== 'registerUser'}"
                [styleClass]="activeFilter !== 'registerUser' ? 'btn-main-outlined' : ''"
                (click)="setFilter('registerUser')"></p-button>
            <p-button type="button" label="Issue Books" [ngClass]="{'p-button-outlined': activeFilter !== 'issueBooks'}"
                [styleClass]="activeFilter !== 'issueBooks' ? 'btn-main-outlined' : ''"
                (click)="setFilter('issueBooks')"></p-button>
            <p-button type="button" label="Return Books"
                [ngClass]="{'p-button-outlined': activeFilter !== 'returnBooks'}"
                [styleClass]="activeFilter !== 'returnBooks' ? 'btn-main-outlined' : ''"
                (click)="setFilter('returnBooks')"></p-button>
        </div>
    </div>

    <!-- Overdue Books -->
    <div class="card border-0 shadow-sm rounded p-3">
        <h3 class="fs-5 fw-semibold mb-2">Overdue Books - {{ overDues.length }}</h3>
        <app-books-overdue [totalOverDues]="overDues"></app-books-overdue>
    </div>
</div>
