<div class="d-flex flex-column gap-4">
    <div class="card border-0 shadow-sm rounded p-4">
        <h2 class="fs-4 fw-semibold mb-1">Check-In/Out Books</h2>
        <p class="small text-muted mb-4">Record book check-ins and check-outs for users</p>

        <form (ngSubmit)="handleSubmit($event)" class="d-flex flex-column gap-4">
            <div class="row g-4">
                <div class="col-md-4">
                    <label class="d-block small fw-medium text-secondary mb-2">
                        Member ID *
                    </label>
                    <input pInputText type="text" [(ngModel)]="formData.memberId" name="memberId"
                        placeholder="Enter member ID" class="form-control" required />
                </div>
                <div class="col-md-4">
                    <label class="d-block small fw-medium text-secondary mb-2">
                        Book ISBN *
                    </label>
                    <input pInputText type="text" [(ngModel)]="formData.isbn" name="isbn" placeholder="Enter ISBN"
                        class="form-control" required />
                </div>
                <div class="col-md-4">
                    <label class="d-block small fw-medium text-secondary mb-2">
                        Return Date *
                    </label>
                    <p-calendar [(ngModel)]="formData.returnDate" name="returnDate" dateFormat="yy-mm-dd"
                        placeholder="Select return date" styleClass="w-100" [style]="{'width': '100%'}"
                        [showIcon]="true" required></p-calendar>
                </div>
            </div>

            <div class="d-flex align-items-center gap-3 justify-content-end">
                <button pButton label="Clear" class="p-button-outlined btn-sm"></button>
                <button pButton label="Checkout Book" class="p-button-outlined btn-sm active-filter"></button>
            </div>
        </form>
    </div>
</div>
