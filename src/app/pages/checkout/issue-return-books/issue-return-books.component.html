<p-dialog [header]="header" [(visible)]="bcDialogVisible" [modal]="true" [style]="{ width: '60vw' }" appendTo="body" (onShow)="setFocus()"
    (onHide)="hideDialog()">
    <ng-template pTemplate="header">
        <span *ngIf="selectedBook.BookCirculationId  == null || selectedBook.BookCirculationId  == 0">{{header}}</span>
        <!-- Empty span prevents layout collapse when text is hidden -->
        <span *ngIf="selectedBook.BookCirculationId  !=null && selectedBook.BookCirculationId  >0">{{header}} (Book
            Circulation ID: {{ selectedBook.BookCirculationId }})</span>
    </ng-template>
    <!-- <div class="mb-3">
        <p class="small fw-medium text-secondary mb-1">Book Circulation ID: {{ selectedBook.BookCirculationId }}</p>
    </div> -->
    <div class="row">
        <div class="col-6 mb-3">
            <label class="d-block small fw-medium text-secondary mb-1" for="book">
                Book Name<sup>*</sup>
            </label>            
            <p-select #bookDropdown id="book" [disabled]="!isIssueNewBook || isViewOnly" [(ngModel)]="selectedBook.BookId" (keydown)="onBookKeydown($event)" [showClear]="true"
                [ngModelOptions]="{standalone: true}" [options]="bookOptions" optionLabel="label" optionValue="value" 
                placeholder="Select Book" [editable]="true" styleClass="w-100" appendTo="body" [filter]="true"
                (ngModelChange)="onBookChange()" />
            <div *ngIf="errors.BookName" class="text-danger mt-1 small">{{ errors.BookName }}</div>
        </div>
        <div class="col-6 mb-3">
            <label class="d-block small fw-medium text-secondary mb-1" for="borrowerName">
                Borrower Name<sup>*</sup>
            </label>
            <!-- <input #userBarcodeInput type="text" (keydown.enter)="onUserBarcodeScanned(userBarcodeInput.value); userBarcodeInput.value=''" style="position: absolute; opacity: 0; pointer-events: none;"> -->
            <!-- (keydown.enter)="onUserBarcodeScanned($any($event))" -->
            <p-select #borrwerDropdown id="borrowerName" [(ngModel)]="selectedBook.BorrowerId" [ngModelOptions]="{standalone: true}"
                [options]="userOptions" optionLabel="label" optionValue="value" placeholder="Select Borrower"  (keydown)="onUserKeydown($event)"  [showClear]="true"
                [disabled]="!isIssueNewBook || isViewOnly" [editable]="true" styleClass="w-100" appendTo="body" [filter] = "true"
                (ngModelChange)="onBorrowerChange()" />
            <div *ngIf="errors.BorrowerName" class="text-danger mt-1 small">{{ errors.BorrowerName }}</div>
        </div>
        <div class="col-6 mb-3">
            <label class="d-block small fw-medium text-secondary mb-1" for="issuedBy">
                Issued By<sup>*</sup>
            </label>
            <p-select id="issuedBy"
                [disabled]="(selectedBook.IssuedByUserId != null && selectedBook.IssuedByUserId > 0) || isViewOnly"
                [(ngModel)]="selectedBook.IssuedByUserId" [ngModelOptions]="{standalone: true}" [options]="userOptions"
                optionLabel="label" optionValue="value" placeholder="Select IssuedBy" [editable]="true"
                styleClass="w-100" appendTo="body" (ngModelChange)="onIssuedChange()" />
            <div *ngIf="errors.IssuedByUserName" class="text-danger mt-1 small">{{ errors.IssuedByUserName }}</div>
        </div>
        <div class="col-6 mb-3">
            <label class="d-block small fw-medium text-secondary mb-1" for="issuedDate">
                Issued Date<sup>*</sup>
            </label>
            <p-datepicker [(ngModel)]="issueDate" (ngModelChange)="onIssueDateChange()"
                [ngModelOptions]="{standalone: true}" appendTo="body" dataType="string" [showIcon]="true"
                [readonlyInput]="true" [showOnFocus]="true" dateFormat="yy-mm-dd" [disabled]="true"
                placeholder="Select Issued Date" styleClass="w-100" inputStyleClass="w-100" />
        </div>
        <hr>
        <div class="col-6 mb-3">
            <label class="d-block small fw-medium text-secondary mb-1" for="comments">
                Comments
                <!-- <sup>*</sup> -->
            </label>
            <input id="comments" type="text" class="form-control" pInputText [(ngModel)]="selectedBook.Comments"
                [ngModelOptions]="{standalone: true}" placeholder="Enter Comments" [disabled]="isViewOnly" />
        </div>
        <div class="col-6 mb-3">
            <label class="d-block small fw-medium text-secondary mb-1" for="status">
                Status<sup>*</sup>
            </label>
            <p-select id="status" [disabled]="selectedBook.BookCirculationId === 0 || isViewOnly"
                [(ngModel)]="selectedBook.Status" [ngModelOptions]="{standalone: true}" [options]="statusOptions"
                optionLabel="label" optionValue="value" placeholder="Select Status" (ngModelChange)="onStatusChange()"
                styleClass="w-100" appendTo="body" />
        </div>
        <hr *ngIf="this.isReturnBook">
        <div class="col-6 mb-3" *ngIf="this.isReturnBook">
            <label class="d-block small fw-medium text-secondary mb-1" for="returnedBy">
                Returned By<sup>*</sup>
            </label>
            <p-select id="returnedBy" [disabled]="!isReturnByDifferentUser || isViewOnly"
                [(ngModel)]="selectedBook.ReturnByUserId" [ngModelOptions]="{standalone: true}" [options]="userOptions"
                optionLabel="label" optionValue="value" placeholder="Select ReturnedBy" [editable]="true"
                styleClass="w-100" appendTo="body" (ngModelChange)="onReturnedChange()" />
            <div *ngIf="errors.ReturnByUserName" class="text-danger mt-1 small">{{ errors.ReturnByUserName }}</div>
        </div>
        <div class="col-6 mb-3" *ngIf="this.isReturnBook">
            <label class="d-block small fw-medium text-secondary mb-1" for="returnedDate">
                Returned Date<sup>*</sup>
            </label>
            <p-datepicker [(ngModel)]="returnDate" (ngModelChange)="onReturnDateChange()"
                [ngModelOptions]="{standalone: true}" appendTo="body" dataType="string" [showIcon]="true"
                [readonlyInput]="true" [showOnFocus]="true" dateFormat="yy-mm-dd" [minDate]="minDate"
                [maxDate]="maxDate" placeholder="Select Return Date" styleClass="w-100" inputStyleClass="w-100"
                [disabled]="isViewOnly" />
        </div>
        <hr *ngIf="this.isOverDue">
        <div class="col-6 mb-3" *ngIf="this.isOverDue">
            <label class="d-block small fw-medium text-secondary mb-1" for="overDueFrom">
                OverDue From<sup>*</sup>
            </label>
            <p-datepicker [(ngModel)]="overdueFrom" (ngModelChange)="onOverdueFromChange()"
                [ngModelOptions]="{standalone: true}" appendTo="body" dataType="string" [showIcon]="true"
                [readonlyInput]="true" [showOnFocus]="true" dateFormat="yy-mm-dd" [disabled]="true"
                placeholder="Select Over Due Date" styleClass="w-100" inputStyleClass="w-100" />
        </div>
        <div class="col-6 mb-3" *ngIf="this.isOverDue">
            <label class="d-block small fw-medium text-secondary mb-1" for="overDueDays">
                OverDue Days<sup>*</sup>
            </label>
            <input id="overDueDays" type="text" class="form-control" pInputText [disabled]="true"
                [(ngModel)]="selectedBook.OverDueDays" [ngModelOptions]="{standalone: true}"
                placeholder="Enter Over Due days" />
        </div>
        <div class="col-6 mb-3" *ngIf="this.isOverDue">
            <label class="d-block small fw-medium text-secondary mb-1" for="fineAmount">
                Fine Amount<sup>*</sup>
            </label>
            <input id="fineAmount" type="text" class="form-control" pInputText [disabled]="true"
                [(ngModel)]="selectedBook.FineAmount" [ngModelOptions]="{standalone: true}"
                placeholder="Enter Fine amount" />
        </div>
        <div class="col-6 mb-3" *ngIf="this.isOverDue">
            <label class="d-block small fw-medium text-secondary mb-1" for="overDueStatus">
                OverDue Status<sup>*</sup>
            </label>
            <p-select id="overDueStatus" [(ngModel)]="selectedBook.OverDueStatus" [ngModelOptions]="{standalone: true}"
                [disabled]="!(selectedBook.Status == 'Returned') || isViewOnly" [options]="overDueStatusOptions"
                optionLabel="label" optionValue="value" placeholder="Select OverDue Status" styleClass="w-100"
                appendTo="body" />
        </div>
        <div class="col-6 mb-3" *ngIf="this.isOverDue">
            <label class="d-block small fw-medium text-secondary mb-1" for="paidAmount">
                Paid Amount<sup>*</sup>
            </label>
            <input id="paidAmount" type="text" class="form-control" pInputText
                [disabled]="!(selectedBook.Status == 'Returned') || isViewOnly" [(ngModel)]="selectedBook.PaidAmount"
                [ngModelOptions]="{standalone: true}" (ngModelChange)="validateInput('PaidAmount')"
                placeholder="Enter Paid amount" />
            <div *ngIf="errors.PaidAmount" class="text-danger mt-1 small">{{ errors.PaidAmount }}</div>
        </div>
        <div class="col-6 mb-3" *ngIf="this.isOverDue">
            <label class="d-block small fw-medium text-secondary mb-1" for="paymentTypeId">
                Payment Type<sup>*</sup>
            </label>
            <p-select id="paymentTypeId" [(ngModel)]="selectedBook.PaymentTypeId" [ngModelOptions]="{standalone: true}"
                [disabled]="!(selectedBook.Status == 'Returned') || isViewOnly" [options]="transactionTypeOptions"
                optionLabel="label" optionValue="value" placeholder="Select Payment Type"
                (ngModelChange)="validateInput('PaymentType')" styleClass="w-100" appendTo="body" />
            <div *ngIf="errors.PaymentTypeId" class="text-danger mt-1 small">{{ errors.PaymentTypeId }}</div>
        </div>
    </div>
    <ng-template pTemplate="footer">
        <div class="d-flex justify-content-end align-items-center gap-3" *ngIf="!isViewOnly">
            <div class="d-flex align-items-center" *ngIf="this.isReturnBook">
                <label class="form-check-label small fw-medium text-secondary me-2" for="diffUserCheck">
                    Return By Different User
                </label>
                <p-checkbox inputId="diffUserCheck" [binary]="true" [(ngModel)]="isReturnByDifferentUser"
                    [ngModelOptions]="{standalone: true}" (onChange)="returnByDifferentUser()"></p-checkbox>
            </div>

            <p-button type="button" label="Cancel" [style]="{ width: '6rem' }" class="p-button-outlined"
                styleClass="btn-main-outlined" (click)="bcDialogVisible = false"></p-button>
            <p-button type="button" label="Save" [style]="{ width: '6rem' }" styleClass="btn-main"
                [disabled]="(selectedBook.Status == 'Returned' && selectedBook.OverDueStatus == 'Pending')"
                (click)="saveBcDetails()"></p-button>
        </div>
    </ng-template>
</p-dialog>
