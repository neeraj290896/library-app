<div class="d-flex flex-column gap-4">
    <div class="card border-0 shadow-sm rounded p-4">
        <!-- Header -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h2 class="fs-4 fw-semibold mb-1">Books</h2>
                <p class="small text-muted mb-0">Manage books</p>
            </div>
            <div class="position-relative">
                <span class="pi pi-search search-icon position-absolute text-muted"></span>
                <input pInputText type="text" placeholder="Search book" [(ngModel)]="searchTerm"
                    (input)="onSearch(searchTerm)" class="form-control ps-5" />
            </div>
        </div>

        <!-- Filter Tabs -->
        <p-tabView [(activeIndex)]="activeTab" class="books-tabs">
            <p-tabPanel [header]="'Overview - ' + totalBooks()"></p-tabPanel>
            <p-tabPanel header="Manage Books"></p-tabPanel>
            <p-tabPanel header="Manage Author"></p-tabPanel>
            <p-tabPanel header="Manage Publisher"></p-tabPanel>
            <p-tabPanel header="Manage Category"></p-tabPanel>
            <p-tabPanel header="Manage Language"></p-tabPanel>
        </p-tabView>

        <!-- Books Table -->
        <div class="table-responsive">
            <p-table [value]="filteredBooks()" styleClass="compact-table"
                [tableStyle]="{'width':'100%','font-size':'0.875rem'}">
                <ng-template pTemplate="header">
                    <tr class="border-bottom">
                        <th class="text-start text-muted fw-medium" style="width: 80px;">S.no</th>
                        <th class="text-start text-muted fw-medium">Title</th>
                        <th class="text-start text-muted fw-medium">Author</th>
                        <th class="text-start text-muted fw-medium">Publisher</th>
                        <th class="text-start text-muted fw-medium">Status</th>
                        <th class="text-start text-muted fw-medium" style="width: 120px;">Action</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-book>
                    <tr class="border-bottom table-row">
                        <td>{{ book.sno }}</td>
                        <td>{{ book.title }}</td>
                        <td>{{ book.author }}</td>
                        <td>{{ book.publisher }}</td>
                        <td>
                            <p-tag [value]="book.status" [severity]="getStatusSeverity(book.status)"></p-tag>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <button pButton icon="pi pi-pencil" (click)="editBook(book)"
                                    class="p-button-rounded p-button-text p-button-sm btn-icon"></button>
                                <button pButton icon="pi pi-trash" (click)="deleteBook(book)"
                                    class="p-button-rounded p-button-text p-button-danger p-button-sm btn-icon"></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>

        <!-- Pagination -->
        <div class="d-flex align-items-center justify-content-center mt-4 gap-3">
            <button pButton label="< PREVIOUS" class="p-button-outlined btn-sm"></button>
            <button pButton label="NEXT >>" class="p-button-outlined btn-sm"></button>
        </div>
    </div>
</div>
