<div class="books-container d-flex flex-column gap-4">
    <div class="card border-0 shadow-sm rounded p-3 card-container">
        <!-- Header -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h2 class="fs-4 fw-semibold mb-1">Books</h2>
                <p class="small text-muted mb-0">Manage books</p>
            </div>
            <app-search></app-search>
        </div>

        <!-- Filter Tabs -->
        <p-tabView [(activeIndex)]="activeTab" class="books-tabs">
            <p-tabPanel header="Manage Books">
                <app-books-manage-books *ngIf="activeTab === 0"></app-books-manage-books>
            </p-tabPanel>

            <p-tabPanel header="Manage Author">
                <app-books-manage-author *ngIf="activeTab === 1"></app-books-manage-author>
            </p-tabPanel>

            <p-tabPanel header="Manage Publisher">
                <app-books-manage-publisher *ngIf="activeTab === 2"></app-books-manage-publisher>
            </p-tabPanel>

            <p-tabPanel header="Manage Category">
                <app-books-manage-category *ngIf="activeTab === 3"></app-books-manage-category>
            </p-tabPanel>

            <p-tabPanel header="Manage Language">
                <app-books-manage-language *ngIf="activeTab === 4"></app-books-manage-language>
            </p-tabPanel>
            <p-tabPanel header="Manage Subject">
                <app-books-manage-subject *ngIf="activeTab === 5"></app-books-manage-subject>
            </p-tabPanel>

            <p-tabPanel header="Manage Buildings" *ngIf="canAccessBuilding_Floor_Rack">
                <app-manage-building *ngIf="activeTab === 6"></app-manage-building>
            </p-tabPanel>
            <p-tabPanel header="Manage Floors" *ngIf="canAccessBuilding_Floor_Rack">
                <app-manage-floor *ngIf="activeTab === 7"></app-manage-floor>
            </p-tabPanel>
            <p-tabPanel header="Manage Racks" *ngIf="canAccessBuilding_Floor_Rack">
                <app-manage-rack *ngIf="activeTab === 8"></app-manage-rack>
            </p-tabPanel>
        </p-tabView>
    </div>
</div>
