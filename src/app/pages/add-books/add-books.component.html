<div style="display: flex; flex-direction: column; gap: 1.5rem;">
  <div style="background-color: white; border-radius: 0.5rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
    <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Add New Book</h2>
    <p style="font-size: 0.875rem; color: #6b7280; margin-bottom: 1.5rem;">Add a new book to the library collection</p>

    <form (ngSubmit)="handleSubmit($event)" style="display: flex; flex-direction: column; gap: 1.5rem;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
            Book Title *
          </label>
          <input
            pInputText
            type="text"
            [(ngModel)]="formData.title"
            name="title"
            placeholder="Enter book title"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; outline: none;"
            required
          />
        </div>
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
            Author Name *
          </label>
          <input
            pInputText
            type="text"
            [(ngModel)]="formData.author"
            name="author"
            placeholder="Enter author name"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; outline: none;"
            required
          />
        </div>
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
            ISBN *
          </label>
          <input
            pInputText
            type="text"
            [(ngModel)]="formData.isbn"
            name="isbn"
            placeholder="Enter ISBN"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; outline: none;"
            required
          />
        </div>
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
            Publisher
          </label>
          <input
            pInputText
            type="text"
            [(ngModel)]="formData.publisher"
            name="publisher"
            placeholder="Enter publisher"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; outline: none;"
          />
        </div>
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
            Quantity *
          </label>
          <input
            type="number"
            [(ngModel)]="formData.quantity"
            name="quantity"
            placeholder="Enter quantity"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; outline: none;"
            required
          />
        </div>
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
            Category *
          </label>
          <select
            [(ngModel)]="formData.category"
            name="category"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; outline: none;"
            required
          >
            <option value="">Select category</option>
            <option value="fiction">Fiction</option>
            <option value="non-fiction">Non-Fiction</option>
            <option value="science">Science</option>
            <option value="history">History</option>
            <option value="biography">Biography</option>
          </select>
        </div>
      </div>

      <div>
        <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
          Description
        </label>
        <textarea
          pInputText
          [(ngModel)]="formData.description"
          name="description"
          placeholder="Enter book description"
          style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; outline: none; min-height: 120px; resize: vertical;"
        ></textarea>
      </div>

      <div style="display: flex; align-items: center; gap: 1rem; justify-content: flex-end;">
        <button pButton type="reset" class="btn-secondary" style="padding: 0.75rem 1.5rem; background-color: white; color: #374151; border: 1px solid #e5e7eb; border-radius: 0.5rem; cursor: pointer; font-weight: 500; transition: all 0.2s;">Clear</button>
        <button pButton type="submit" class="btn-primary" style="padding: 0.75rem 1.5rem; background-color: #22c55e; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 500; transition: all 0.2s;">Add Book</button>
      </div>
    </form>
  </div>
</div>
