<div style="display: flex; flex-direction: column; gap: 1.5rem;">
  <div style="background-color: white; border-radius: 0.5rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
      <div>
        <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Staff Management</h2>
        <p style="font-size: 0.875rem; color: #6b7280;">Manage library staff members</p>
      </div>
      <button style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; background-color: #22c55e; color: white; border: none; border-radius: 0.5rem; font-size: 0.875rem; cursor: pointer; transition: all 0.2s ease;" class="btn-add-staff">
        <span>➕</span>
        Add Staff Member
      </button>
    </div>

    <div style="overflow-x: auto;">
      <table style="width: 100%; font-size: 0.875rem;">
        <thead>
          <tr style="border-bottom: 1px solid #e5e7eb;">
            <th style="text-align: left; padding: 0.75rem; color: #6b7280; font-weight: 500;">Staff ID</th>
            <th style="text-align: left; padding: 0.75rem; color: #6b7280; font-weight: 500;">Name</th>
            <th style="text-align: left; padding: 0.75rem; color: #6b7280; font-weight: 500;">Role</th>
            <th style="text-align: left; padding: 0.75rem; color: #6b7280; font-weight: 500;">Email</th>
            <th style="text-align: left; padding: 0.75rem; color: #6b7280; font-weight: 500;">Status</th>
            <th style="text-align: left; padding: 0.75rem; color: #6b7280; font-weight: 500;">Action</th>
          </tr>
        </thead>
        <tbody>
          @for (staff of staffMembers(); track staff.id) {
            <tr style="border-bottom: 1px solid #e5e7eb; transition: background-color 0.2s ease;">
              <td style="padding: 1rem 0.75rem;">{{ staff.id }}</td>
              <td style="padding: 1rem 0.75rem;">{{ staff.name }}</td>
              <td style="padding: 1rem 0.75rem;">{{ staff.role }}</td>
              <td style="padding: 1rem 0.75rem;">{{ staff.email }}</td>
              <td style="padding: 1rem 0.75rem;">
                <span style="padding: 0.25rem 0.75rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600;"
                      [style]="{'background-color': staff.status === 'Active' ? '#dcfce7' : '#fee2e2',
                                'color': staff.status === 'Active' ? '#166534' : '#991b1b'}">
                  {{ staff.status }}
                </span>
              </td>
              <td style="padding: 1rem 0.75rem;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  <button style="padding: 0.25rem 0.75rem; background-color: #6b7280; color: white; border: none; border-radius: 0.25rem; font-size: 0.75rem; cursor: pointer; transition: background-color 0.2s;" class="btn-edit">
                    Edit
                  </button>
                  <button style="padding: 0.25rem 0.75rem; background-color: #ef4444; color: white; border: none; border-radius: 0.25rem; font-size: 0.75rem; cursor: pointer; transition: background-color 0.2s;" class="btn-delete">
                    Delete
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
