<div class="d-flex vh-100 overflow-hidden">
    <!-- Sidebar -->
    <aside [class.collapsed]="sidebarCollapsed()"
        class="sidebar bg-white shadow-lg d-flex flex-column vh-100 flex-shrink-0"
        [style.width]="sidebarCollapsed() ? '80px' : '288px'">

        <!-- Header with Logo and Toggle -->
        <div class="p-4 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2 overflow-hidden">
                @if (!sidebarCollapsed()) {
                <div class="logo-container d-flex align-items-center justify-content-center flex-shrink-0">
                    <div class="logo-inner"></div>
                </div>
                <h1 class="fs-6 fw-semibold mb-0 text-nowrap">Library</h1>
                }
            </div>
            <button pButton icon="pi pi-bars" (click)="toggleSidebar()"
                class="p-button-text p-button-rounded p-button-sm toggle-btn flex-shrink-0"
                [style.margin-left]="sidebarCollapsed() ? '-0.5rem' : '0'"></button>
        </div>

        <nav class="flex-grow-1 px-3 overflow-auto">
            @for (item of menuItems; track item.path) {
            <a [routerLink]="item.path" [routerLinkActive]="'nav-link-active'"
                [routerLinkActiveOptions]="{ exact: true }" class="nav-link" [class.collapsed]="sidebarCollapsed()"
                [pTooltip]="sidebarCollapsed() ? item.label : ''">
                <span class="nav-icon flex-shrink-0">
                    <i [class]="item.icon"></i>
                </span>
                @if (!sidebarCollapsed()) {
                <span class="nav-label">{{ item.label }}</span>
                }
            </a>
            }
        </nav>

        <nav class="flex-shrink-0 p-3 overflow-auto">
            <a class="nav-link logout-link" [class.collapsed]="sidebarCollapsed()"
                [pTooltip]="sidebarCollapsed() ? 'Logout' : ''">
                <span class="nav-icon flex-shrink-0">
                    <i class="pi pi-sign-out"></i>
                </span>
                @if (!sidebarCollapsed()) {
                <span class="nav-label">Logout</span>
                }
            </a>
        </nav>
    </aside>

    <!-- Main content -->
    <div class="main-content flex-grow-1 d-flex flex-column overflow-hidden"
        [class.sidebar-collapsed]="sidebarCollapsed()">
        <!-- Header -->
        <header class="bg-white shadow-lg flex-shrink-0">
            <div class="d-flex align-items-center justify-content-between py-2 px-4">
                <div class="col-4"></div>
                <div class="col-4 d-flex align-items-center justify-content-center">
                    <img src="assets/images/logo.png" alt="Logo" class="header-logo me-3" />
                    <h2 class="fs-5 fw-semibold mb-0">Mystic Falls High School</h2>
                </div>
                <div class="col-4 d-flex align-items-center justify-content-end gap-3 fs-5">
                    <span>🔔</span>
                    <div class="d-flex align-items-center gap-2">
                        <span>👤</span>
                        <span class="fs-6 text-muted">{{ userName() }}</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <main class="flex-grow-1 overflow-auto p-4 bg-light">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
