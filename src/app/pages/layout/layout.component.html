<div style="display: flex; height: 100vh; overflow: hidden;">
  <!-- Sidebar -->
  <aside class="w-72 bg-white shadow-sm flex flex-col"
    style="width: 288px; background-color: white; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15); display: flex; flex-direction: column; height: 100vh; flex-shrink: 0;">
    <div style="padding: 1.5rem;">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <div
          style="width: 32px; height: 32px; background-color: #111827; border-radius: 0.25rem; display: flex; align-items: center; justify-content: center;">
          <div style="width: 16px; height: 16px; border: 2px solid white; border-radius: 0.125rem;"></div>
        </div>
        <h1 style="font-size: 1.125rem; font-weight: 600;">Library App</h1>
      </div>
    </div>

    <nav style="flex: 1; padding: 0 1rem; overflow-y: auto;">
      @for (item of filteredMenuItems(); track item.path) {
      <a [routerLink]="item.path" [routerLinkActive]="'nav-link-active'" [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link">
        <span style="font-size: 1.25rem;">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
      }
    </nav>

    <div style="padding: 1rem; flex-shrink: 0;">
      <button (click)="logout()" class="btn-logout">
        <span style="font-size: 1.25rem;">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
    <!-- Header -->
    <header
      style="background-color: white; padding: 1rem 2rem; flex-shrink: 0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div>
          <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Welcome back</h2>
          <p style="font-size: 0.875rem; color: #6b7280; margin-bottom: 0;">{{ userName() }}</p>
        </div>
        <div style="display: flex; align-items: center; gap: 1.5rem; font-size: 1.25rem;">
          <span>🔔</span>
          <span>👤</span>
        </div>
      </div>
    </header>

    <!-- Content Area -->
    <main style="flex: 1; overflow-y: auto; padding: 1.5rem 2rem; background-color: #efefef;">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
