<div style="display: flex; flex-direction: column; gap: 1.5rem;">
  <div style="background-color: white; border-radius: 0.5rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
    <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Check-out Books</h2>
    <p style="font-size: 0.875rem; color: #6b7280; margin-bottom: 1.5rem;">Record book checkouts for members</p>

    <form (ngSubmit)="handleSubmit($event)" style="display: flex; flex-direction: column; gap: 1.5rem;">
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem;">
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
            Member ID *
          </label>
          <input
            pInputText
            type="text"
            [(ngModel)]="formData.memberId"
            name="memberId"
            placeholder="Enter member ID"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; outline: none;"
            required
          />
        </div>
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
            Book ISBN *
          </label>
          <input
            pInputText
            type="text"
            [(ngModel)]="formData.isbn"
            name="isbn"
            placeholder="Enter ISBN"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; outline: none;"
            required
          />
        </div>
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
            Return Date *
          </label>
          <input
            type="date"
            [(ngModel)]="formData.returnDate"
            name="returnDate"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; outline: none;"
            required
          />
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 1rem; justify-content: flex-end;">
        <button pButton type="reset" class="btn-secondary" style="padding: 0.75rem 1.5rem; background-color: white; color: #374151; border: 1px solid #e5e7eb; border-radius: 0.5rem; cursor: pointer; font-weight: 500; transition: all 0.2s;">Clear</button>
        <button pButton type="submit" class="btn-primary" style="padding: 0.75rem 1.5rem; background-color: #22c55e; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 500; transition: all 0.2s;">Checkout Book</button>
      </div>
    </form>
  </div>
</div>
